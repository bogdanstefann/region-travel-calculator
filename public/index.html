<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Region Travel Calculator – WarEra</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --paper: #E3E7DA;
    --panel: #F4F6EF;
    --ink: #1C2A21;
    --muted: #5A6A5E;
    --line: #C2CBB6;
    --route: #2447C7;
    --start: #B8431E;
    --display: "Chakra Petch", "Arial Narrow", sans-serif;
    --body: "IBM Plex Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.5 var(--body);
  }
  header { padding: 2rem 1.5rem 1rem; max-width: 1200px; margin: 0 auto; }
  h1 {
    font: 700 clamp(2rem, 5vw, 3.25rem)/1 var(--display);
    margin: 0 0 .5rem; letter-spacing: -.01em;
  }
  header p { margin: 0; color: var(--muted); max-width: 60ch; }

  main {
    max-width: 1200px; margin: 0 auto; padding: 1rem 1.5rem 3rem;
    display: grid; grid-template-columns: 340px 1fr; gap: 1.5rem; align-items: start;
  }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 1.25rem; display: grid; gap: .75rem;
  }
  label.field { font-weight: 600; font-size: .95rem; }
  input[type=text] {
    width: 100%; padding: .6rem .7rem; font: inherit; color: inherit;
    background: #fff; border: 1px solid var(--line); border-radius: 4px;
  }
  .row { display: flex; gap: .5rem; }
  button {
    font: 600 1rem var(--body); cursor: pointer; border-radius: 4px;
    padding: .6rem .9rem; border: 1px solid var(--ink); background: transparent; color: var(--ink);
  }
  button.primary {
    background: var(--route); border-color: var(--route); color: #fff;
    font-family: var(--display); font-size: 1.1rem; padding: .75rem;
  }
  :focus-visible { outline: 3px solid var(--start); outline-offset: 2px; }

  #chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem; }
  #chips li {
    display: flex; align-items: center; gap: .35rem; background: #fff;
    border: 1px solid var(--line); border-radius: 999px; padding: .2rem .3rem .2rem .7rem; font-size: .9rem;
  }
  #chips button { border: 0; padding: 0 .35rem; font-size: 1.1rem; line-height: 1; color: var(--muted); }
  #chips:empty::after { content: "No boxes added yet."; color: var(--muted); font-size: .9rem; }

  fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: .25rem; }
  legend { font-weight: 600; font-size: .95rem; margin-bottom: .25rem; }
  #msg { margin: 0; min-height: 1.5em; color: var(--start); font-size: .95rem; }

  .result { display: grid; gap: 1rem; }
  #map { height: 480px; border-radius: 6px; border: 1px solid var(--line); background: #cfd6c4; }
  @media (max-width: 820px) { #map { height: 340px; } }

  #route { list-style: none; margin: 0; padding: 0; counter-reset: stop; }
  #route li {
    display: grid; grid-template-columns: 2.25rem 1fr auto; gap: .75rem; align-items: center;
    padding: .6rem 0; border-bottom: 1px solid var(--line);
  }
  #route .n {
    width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center;
    background: var(--route); color: #fff; font: 700 .95rem var(--display);
  }
  #route li.start .n { background: var(--start); }
  #route .name { font-weight: 600; }
  #route .city { color: var(--muted); font-size: .9rem; }
  #route .leg { text-align: right; font-variant-numeric: tabular-nums; font-size: .95rem; }
  #total { margin: 0; font: 700 1.3rem var(--display); }

  .pin {
    width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    background: var(--route); color: #fff; font: 700 13px var(--display);
    border: 2px solid #fff; box-shadow: 0 1px 3px rgba(28,42,33,.4);
  }
  .pin.start { background: var(--start); }
</style>
</head>
<body>
<header>
  <h1>Region Travel Calculator</h1>
  <p>Enter the region you’re in and the regions with boxes. You’ll get the order to visit them in so the total trip is as short as possible.</p>
</header>

<main>
  <section class="panel" aria-label="Input">
    <label class="field" for="start">Your region</label>
    <input type="text" id="start" list="regions" placeholder="Name, ID or link" autocomplete="off">

    <label class="field" for="box">Regions with boxes</label>
    <div class="row">
      <input type="text" id="box" list="regions" placeholder="Name, ID or link" autocomplete="off">
      <button type="button" id="add">Add</button>
    </div>
    <ul id="chips"></ul>

    <fieldset>
      <legend>Optimize for</legend>
      <label><input type="radio" name="mode" value="km" checked> Kilometers</label>
      <label><input type="radio" name="mode" value="hops"> Regions crossed</label>
    </fieldset>

    <button type="button" id="go" class="primary">Calculate route</button>
    <p id="msg" role="status"></p>
  </section>

  <section class="result" aria-label="Result">
    <div id="map"></div>
    <ol id="route"></ol>
    <p id="total"></p>
  </section>
</main>

<datalist id="regions"></datalist>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
let regions = {};
const byLabel = new Map();
let boxes = [];
let map, layer;

const label = (r) => `${r.name} (${r.mainCity})`;
const msg = (t) => { $("#msg").textContent = t; };

/* ---------- Data ---------- */
async function loadRegions() {
  msg("Loading regions…");
  const sources = ["/api/regions", "https://api2.warera.io/trpc/region.getRegionsObject"];
  for (const url of sources) {
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      regions = (await res.json()).result.data;
      if (regions && Object.keys(regions).length) break;
    } catch (_) { /* try the next source */ }
  }
  if (!Object.keys(regions).length) {
    msg("Couldn’t load the regions. Please reload the page.");
    return;
  }
  const dl = $("#regions");
  Object.entries(regions)
    .sort(([, a], [, b]) => a.name.localeCompare(b.name))
    .forEach(([id, r]) => {
      const l = label(r);
      byLabel.set(l.toLowerCase(), id);
      const o = document.createElement("option");
      o.value = l;
      dl.appendChild(o);
    });
  msg("");
  restore();
}

function resolve(text) {
  const t = text.trim();
  if (!t) return null;
  const id = (t.match(/[0-9a-f]{24}/) || [])[0];
  if (id && regions[id]) return id;
  const low = t.toLowerCase();
  return byLabel.get(low)
    || Object.keys(regions).find((k) => regions[k].name.toLowerCase() === low)
    || null;
}

/* ---------- Local save ---------- */
function save() {
  try {
    localStorage.setItem("route", JSON.stringify({ start: $("#start").value, boxes }));
  } catch (_) {}
}
function restore() {
  try {
    const s = JSON.parse(localStorage.getItem("route") || "null");
    if (!s) return;
    $("#start").value = s.start || "";
    boxes = (s.boxes || []).filter((id) => regions[id]);
    renderChips();
  } catch (_) {}
}

/* ---------- Boxes ---------- */
function renderChips() {
  const ul = $("#chips");
  ul.innerHTML = "";
  boxes.forEach((id) => {
    const li = document.createElement("li");
    li.textContent = label(regions[id]);
    const x = document.createElement("button");
    x.type = "button";
    x.textContent = "×";
    x.setAttribute("aria-label", `Remove ${regions[id].name}`);
    x.onclick = () => { boxes = boxes.filter((b) => b !== id); renderChips(); save(); };
    li.appendChild(x);
    ul.appendChild(li);
  });
}

function addBox() {
  const input = $("#box");
  const id = resolve(input.value);
  if (!id) { msg("Can’t find that region. Pick one from the list or paste an ID."); return; }
  if (!boxes.includes(id)) boxes.push(id);
  input.value = "";
  msg("");
  renderChips();
  save();
  input.focus();
}

/* ---------- Distances ---------- */
function haversine([lng1, lat1], [lng2, lat2]) {
  const rad = Math.PI / 180;
  const dlat = (lat2 - lat1) * rad, dlng = (lng2 - lng1) * rad;
  const a = Math.sin(dlat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dlng / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(a));
}

function bfs(from) {
  const d = { [from]: 0 };
  const q = [from];
  for (let i = 0; i < q.length; i++) {
    const id = q[i];
    for (const n of (regions[id] && regions[id].neighbors) || []) {
      if (!(n in d)) { d[n] = d[id] + 1; q.push(n); }
    }
  }
  return d;
}

/* ---------- Route ---------- */
const BIG = 1e9;
const length = (path, c) => path.reduce((s, v, i) => (i ? s + c[path[i - 1]][v] : 0), 0);

function solve(n, c) {
  // Up to 10 boxes: exhaustive search with pruning (optimal result)
  if (n - 1 <= 10) {
    let best = Infinity, bestPath = null;
    const path = [0], used = Array(n).fill(false);
    used[0] = true;
    (function dfs(len) {
      if (len >= best) return;
      if (path.length === n) { best = len; bestPath = path.slice(); return; }
      const last = path[path.length - 1];
      for (let j = 1; j < n; j++) {
        if (used[j]) continue;
        used[j] = true; path.push(j);
        dfs(len + c[last][j]);
        path.pop(); used[j] = false;
      }
    })(0);
    return bestPath;
  }
  // Over 10: nearest neighbor + 2-opt
  let path = [0];
  const left = new Set([...Array(n).keys()].slice(1));
  while (left.size) {
    const last = path[path.length - 1];
    let nxt = null;
    for (const j of left) if (nxt === null || c[last][j] < c[last][nxt]) nxt = j;
    path.push(nxt); left.delete(nxt);
  }
  let improved = true;
  while (improved) {
    improved = false;
    for (let i = 1; i < n - 1; i++) {
      for (let j = i + 1; j < n; j++) {
        const cand = [...path.slice(0, i), ...path.slice(i, j + 1).reverse(), ...path.slice(j + 1)];
        if (length(cand, c) < length(path, c)) { path = cand; improved = true; }
      }
    }
  }
  return path;
}

function calculate() {
  const start = resolve($("#start").value);
  if (!start) { msg("Pick the region you’re in."); return; }
  const list = boxes.filter((b) => b !== start);
  if (!list.length) { msg("Add at least one region with a box."); return; }
  msg("");
  save();

  const pts = [start, ...list];
  const km = pts.map((a) => pts.map((b) => haversine(regions[a].position, regions[b].position)));
  const hops = pts.map((a) => { const d = bfs(a); return pts.map((b) => (b in d ? d[b] : BIG)); });

  const mode = document.querySelector("input[name=mode]:checked").value;
  const order = solve(pts.length, mode === "km" ? km : hops);
  render(order.map((i) => pts[i]), order, km, hops, mode);
}

/* ---------- Rendering ---------- */
const fmtKm = (x) => `${Math.round(x).toLocaleString("en-US")} km`;
const fmtHops = (x) => (x >= BIG ? "no path" : `${x} ${x === 1 ? "region" : "regions"}`);

function render(ids, order, km, hops, mode) {
  const ol = $("#route");
  ol.innerHTML = "";
  let totalKm = 0, totalHops = 0;

  ids.forEach((id, k) => {
    const r = regions[id];
    const li = document.createElement("li");
    if (k === 0) li.className = "start";
    let leg = "Starting point";
    if (k > 0) {
      const a = order[k - 1], b = order[k];
      totalKm += km[a][b];
      totalHops += hops[a][b];
      leg = `+${fmtKm(km[a][b])}<br>${fmtHops(hops[a][b])}`;
    }
    li.innerHTML = `<span class="n">${k === 0 ? "★" : k}</span>
      <span><span class="name"></span><br><span class="city"></span></span>
      <span class="leg">${leg}</span>`;
    li.querySelector(".name").textContent = r.name;
    li.querySelector(".city").textContent = r.mainCity;
    ol.appendChild(li);
  });

  const hopsText = totalHops >= BIG ? "some boxes have no land path" : fmtHops(totalHops);
  $("#total").textContent = mode === "km"
    ? `Total: ${fmtKm(totalKm)} (${hopsText})`
    : `Total: ${hopsText} (${fmtKm(totalKm)})`;

  drawMap(ids);
}

function drawMap(ids) {
  if (!map) {
    map = L.map("map", { worldCopyJump: true }).setView([30, 10], 2);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 8,
      attribution: "&copy; OpenStreetMap",
    }).addTo(map);
  }
  if (layer) layer.remove();
  layer = L.layerGroup().addTo(map);

  const latlngs = ids.map((id) => [regions[id].position[1], regions[id].position[0]]);
  L.polyline(latlngs, { color: "#2447C7", weight: 3, dashArray: "6 6" }).addTo(layer);
  latlngs.forEach((ll, k) => {
    const icon = L.divIcon({
      className: "",
      html: `<div class="pin${k === 0 ? " start" : ""}">${k === 0 ? "★" : k}</div>`,
      iconSize: [28, 28], iconAnchor: [14, 14],
    });
    L.marker(ll, { icon, title: label(regions[ids[k]]) }).addTo(layer);
  });
  map.fitBounds(L.latLngBounds(latlngs).pad(0.2));
}

/* ---------- Events ---------- */
$("#add").onclick = addBox;
$("#box").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addBox(); } });
$("#start").addEventListener("change", save);
$("#go").onclick = calculate;

loadRegions();
</script>
</body>
</html>
